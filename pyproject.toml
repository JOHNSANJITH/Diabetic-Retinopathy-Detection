[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetic-retinopathy-cv"
version = "2.0.0"
description = "Explainable 5-class diabetic retinopathy image classification with Xception and FastAPI"
requires-python = ">=3.10,<3.13"
dependencies = [
  "tensorflow>=2.15,<2.20",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.8,<5",
  "matplotlib>=3.7,<4",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
